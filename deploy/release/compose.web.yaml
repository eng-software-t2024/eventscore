name: eventscore-web

services:
  web:
    image: localhost/eventscore-web:154a670
    restart: unless-stopped
    networks:
      - eventscore-backend
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.eventscore-web.rule: "Host(`eventscore.olua.me`)"
      traefik.http.routers.eventscore-web.entrypoints: websecure
      traefik.http.routers.eventscore-web.tls: "true"
      traefik.http.routers.eventscore-web.tls.certresolver: let-enc
      traefik.http.services.eventscore-web.loadbalancer.server.port: "80"

networks:
  eventscore-backend:
    external: true
    name: eventscore_default
  traefik-public:
    external: true
    name: traefik-public
