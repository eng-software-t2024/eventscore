name: eventscore-backend

services:
  api:
    container_name: eventscore-backend
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - .runtime.env
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - eventscore_default
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  eventscore_default:
    external: true
    name: eventscore_default
