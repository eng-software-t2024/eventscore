        tipo:
          $ref: '#/components/schemas/TipoCriterioDesempate'
        desafioId:
          type: integer
          nullable: true
          description: "Obrigatório quando tipo = MAIOR_PONTUACAO_DESAFIO; null nos demais tipos (ADR 0003 / V12)."
