    # ----------------------------------------------------
    # Resultados, Auditoria, Bonificações e Penalidades (#223 / #206)
    # ----------------------------------------------------
    ResultadoDesafioDto:
      type: object
      additionalProperties: false
      description: |
        Item retornado na consulta GET de resultados por desafio.
        Quando id é null, representa preenchimento pendente (colocacao null, ausente false, pontos 0).
        O retorno do PUT utiliza ResultadoDesafioSalvoDto, cujo id não aceita null.
      required:
        - id
        - grupoId
        - colocacao
        - ausente
        - pontos
      properties:
        id:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          description: "null somente quando ainda não existe resultado persistido para o grupo no desafio."
          example: 11
        grupoId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 1
        colocacao:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          example: 1
        ausente:
          type: boolean
          example: false
        pontos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: "Pontos obtidos pelo grupo no desafio; 0 para ausente ou pendente."
          example: 100

    ResultadoDesafioSalvoDto:
      type: object
      additionalProperties: false
      required:
        - id
        - grupoId
        - colocacao
        - ausente
        - pontos
      description: |
        Resultado persistido retornado pelo PUT; não representa uma linha pendente.
        O id é obrigatório e não anulável (nullable: false), inclusive para grupo ausente.
        A colocacao continua anulável para representar ausência, que vale zero ponto.
      properties:
        id:
          type: integer
          nullable: false
          minimum: 1
          maximum: 2147483647
          description: "Identificador persistido e preservado em correções."
          example: 11
        grupoId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 1
        colocacao:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          example: 1
        ausente:
          type: boolean
          example: false
        pontos:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: "Pontos da colocação no desafio; zero para ausência."
          example: 100

    SalvarResultadoDesafioDto:
      type: object
      additionalProperties: false
      required:
        - grupoId
        - colocacao
        - ausente
      properties:
        grupoId:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 1
        colocacao:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2147483647
          description: "null apenas quando ausente = true; inteiro positivo (1..P) quando presente."
          example: 1
        ausente:
          type: boolean
          example: false

    RegistroAuditoriaDto:
      type: object
      required:
        - dataHora
        - usuario
        - operacao
        - valorAnterior
        - valorNovo
      properties:
        dataHora:
          type: string
          format: date-time
          example: "2026-11-23T14:38:00Z"
        usuario:
          type: string
          example: "Administrador Arena"
        operacao:
          type: string
          enum:
            - INSERT
            - UPDATE
            - DELETE
            - RECALCULO
          example: "UPDATE"
        valorAnterior:
          type: string
          nullable: true
          example: "colocacao=2"
        valorNovo:
          type: string
          nullable: true
          example: "colocacao=1"

    ItemBonificacaoLancamentoDto:
      type: object
      required:
        - itemBonificacaoId
        - valor
      properties:
        itemBonificacaoId:
          type: integer
          minimum: 1
          example: 1
        valor:
          type: integer
          minimum: 0
          example: 10

    BonificacaoGrupoResumoDto:
      type: object
      required:
        - grupoId
        - itens
        - total
      properties:
        grupoId:
          type: integer
          example: 1
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemBonificacaoLancamentoDto'
        total:
          type: integer
          example: 18

    PenalidadeDto:
      type: object
      required:
        - id
        - grupoId
        - pontos
        - descricao
        - justificativa
      properties:
        id:
          type: integer
          example: 1
        grupoId:
          type: integer
          example: 2
        pontos:
          type: integer
          example: 20
        descricao:
          type: string
          nullable: true
          description: "Opcional no lançamento; `null` quando não informada."
          example: "Atraso na entrega"
        justificativa:
          type: string
          example: "Entregou o projeto 15 minutos depois do prazo"

    CriarPenalidadeDto:
      type: object
      required:
        - grupoId
        - pontos
        - justificativa
      properties:
        grupoId:
          type: integer
          minimum: 1
          example: 2
        pontos:
          type: integer
          minimum: 1
          example: 20
        descricao:
          type: string
          maxLength: 255
          example: "Atraso na entrega"
        justificativa:
          type: string
          minLength: 1
          maxLength: 500
          example: "Entregou o projeto 15 minutos depois do prazo"

    AtualizarPenalidadeDto:
      type: object
      properties:
        grupoId:
          type: integer
          minimum: 1
          example: 2
        pontos:
          type: integer
          minimum: 1
          example: 15
        descricao:
          type: string
          maxLength: 255
          example: "Atraso na entrega"
        justificativa:
          type: string
          minLength: 1
          maxLength: 500
          example: "Entregou o projeto 15 minutos depois do prazo"

    # ----------------------------------------------------
    # Classificação, Desempates e Apuração (#206 pt 3 / #204)
    # ----------------------------------------------------
    LinhaClassificacaoGrupoDto:
      type: object
      required:
        - posicao
        - grupoId
        - grupo
        - cor
        - pontosDesafios
        - bonificacao
        - penalidade
        - total
        - empatado
      properties:
        posicao:
          type: integer
          minimum: 1
          example: 1
        grupoId:
          type: integer
          example: 1
        grupo:
          type: string
          example: "Alfa"
        cor:
          type: string
          example: "#FF5733"
        pontosDesafios:
          type: integer
          example: 260
        bonificacao:
          type: integer
          example: 18
        penalidade:
          type: integer
          example: 0
        total:
          type: integer
          example: 278
        empatado:
          type: boolean
          example: false

    ResumoClassificacaoDto:
      type: object
      required:
        - desafiosLancados
        - desafiosTotais
        - empatesPendentes
      properties:
        desafiosLancados:
          type: integer
          example: 4
        desafiosTotais:
          type: integer
          example: 4
        empatesPendentes:
          type: array
          description: "Grupos de IDs empatados que não foram separados pelos critérios automáticos nem por decisão manual vigente."
          items:
            type: array
            items:
              type: integer
          example:
            - [2, 3]
            - [5, 6]

    ClassificacaoEnvelopeDto:
      type: object
      required:
        - dados
        - resumo
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/LinhaClassificacaoGrupoDto'
        resumo:
          $ref: '#/components/schemas/ResumoClassificacaoDto'

    PosicaoDesempateItemDto:
      type: object
      required:
        - grupoId
        - posicao
      properties:
        grupoId:
          type: integer
          minimum: 1
          example: 2
        posicao:
          type: integer
          minimum: 1
          example: 1

    RegistrarDesempateDto:
      type: object
      required:
        - posicoes
        - justificativa
      properties:
        posicoes:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/PosicaoDesempateItemDto'
        justificativa:
          type: string
          minLength: 1
          maxLength: 500
          example: "Sorteio na frente das equipes"

    DesempateRegistradoDto:
      type: object
      required:
        - posicoes
        - justificativa
        - responsavel
        - dataHora
      properties:
        posicoes:
          type: array
          items:
            $ref: '#/components/schemas/PosicaoDesempateItemDto'
        justificativa:
          type: string
          example: "Sorteio na frente das equipes"
        responsavel:
          type: string
          example: "Administrador Arena"
        dataHora:
          type: string
          format: date-time
          example: "2026-11-24T20:10:00Z"

    LinhaApuracaoParticipanteDto:
      type: object
      required:
        - participanteId
        - matricula
        - nome
        - turma
        - grupo
        - colocacaoGrupo
        - pontoExtraGrupo
        - diasPresentes
        - diasTotais
        - fator
        - pontoExtra
      properties:
        participanteId:
          type: integer
          example: 1
        matricula:
          type: string
          example: "2026-101"
        nome:
          type: string
          example: "Lucas Vitorino"
        turma:
          type: string
          example: "ES 2026.2"
        grupo:
          type: string
          example: "Alfa"
        colocacaoGrupo:
          type: integer
          example: 1
        pontoExtraGrupo:
          type: number
          example: 1.0
        diasPresentes:
          type: integer
          example: 2
        diasTotais:
          type: integer
          example: 2
        fator:
          type: number
          example: 1.0
        pontoExtra:
          type: number
          example: 1.0

    ResumoApuracaoDto:
      type: object
      required:
        - totalParticipantes
        - assiduidade
        - aptos
      properties:
        totalParticipantes:
          type: integer
          example: 72
        assiduidade:
          type: number
          example: 0.924
        aptos:
          type: integer
          example: 68

    ApuracaoEnvelopeDto:
      type: object
      required:
        - dados
        - paginacao
        - resumo
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/LinhaApuracaoParticipanteDto'
        paginacao:
          $ref: '#/components/schemas/PaginacaoMetaDto'
        resumo:
          $ref: '#/components/schemas/ResumoApuracaoDto'

    # ----------------------------------------------------
    # Relatórios (#207 / #228 / #229)
    # ----------------------------------------------------
    FormatoRelatorio:
      type: string
      description: "Formatos suportados para exportação de relatórios."
      enum:
        - PDF
        - XLSX
      example: PDF

    PresencaDiaRelatorioDto:
      type: object
      required:
        - numeroDia
        - presente
      properties:
        numeroDia:
          type: integer
          minimum: 1
          example: 1
        presente:
          type: boolean
          example: true

    ParticipantePreviaRelatorioDto:
      type: object
      required:
        - matricula
        - nome
        - grupo
        - presencas
        - pontoExtra
      properties:
        matricula:
          type: string
          example: "2026-101"
        nome:
          type: string
          example: "Lucas Vitorino"
        grupo:
          type: string
          example: "Alfa"
        presencas:
          type: array
          items:
            $ref: '#/components/schemas/PresencaDiaRelatorioDto'
        pontoExtra:
          type: number
          example: 1.0

    TurmaPreviaRelatorioDto:
      type: object
      required:
        - turma
        - totalParticipantes
        - participantes
      properties:
        turma:
          type: string
          example: "ES 2026.2"
        totalParticipantes:
          type: integer
          example: 2
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantePreviaRelatorioDto'

    TurmaRelatorioFinalDto:
      type: object
      required: [turma, totalParticipantes, participantes]
      properties:
        turma:
          type: string
          maxLength: 10
          example: "ES 2026.2"
        totalParticipantes:
          type: integer
          minimum: 0
          example: 2
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteRelatorioFinalDto'

    ParticipanteRelatorioFinalDto:
      type: object
      required: [matricula, nome, grupo, presencas, pontoExtra, turma]
      properties:
        matricula:
          type: string
          maxLength: 20
          example: "2026-101"
        nome:
          type: string
          maxLength: 150
          example: "Lucas Vitorino"
        grupo:
          type: string
          maxLength: 60
          example: "Alfa"
        presencas:
          type: array
          items:
            $ref: '#/components/schemas/PresencaRelatorioFinalDto'
        pontoExtra:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.8
        turma:
          type: string
          maxLength: 10
          example: "ES 2026.2"

    PresencaRelatorioFinalDto:
      type: object
      required: [numeroDia, presente]
      properties:
        numeroDia:
          type: integer
          minimum: 1
          example: 1
        presente:
          type: boolean
          example: false

    # ----------------------------------------------------
    # Schemas Compartilhados (Envelopes, Paginação e Enums)
    # ----------------------------------------------------
    PaginacaoMetaDto:
      type: object
      required:
        - pagina
        - tamanho
        - totalItens
        - totalPaginas
      properties:
        pagina:
          type: integer
          minimum: 1
          description: "Página atual consultada (1-indexed)."
          example: 1
        tamanho:
          type: integer
          minimum: 1
          description: "Quantidade de itens exibidos por página."
          example: 20
        totalItens:
          type: integer
          minimum: 0
          description: "Total acumulado de registros encontrados para a consulta."
          example: 45
        totalPaginas:
          type: integer
          minimum: 0
          description: "Total de páginas disponíveis calculadas."
          example: 3

    EnvelopeListagemDto:
      type: object
      description: |
        Padrão arquitetural de envelope JSON acordado no Workshop T06 para listagens com metadados ou métricas acumuladas (participantes, frequência, classificação e apuração).
      required:
        - dados
      properties:
        dados:
          type: array
          description: "Coleção de itens principais retornados pela consulta."
          items:
            type: object
          example:
            - id: 1
              nome: "Participante 1"
            - id: 2
              nome: "Participante 2"
        paginacao:
          $ref: '#/components/schemas/PaginacaoMetaDto'
        resumo:
          type: object
          description: "Métricas consolidadas ou totalizadores agregados pertinentes à listagem."
          example:
            totalPresentes: 110
            totalAusentes: 10
            percentualPresenca: 91.67

    TipoCriterioDesempate:
      type: string
      description: |
        Critérios de desempate homologados na regra de negócio da competição (RF13 / ADR 0003 / V12):
        - `MAIOR_PONTUACAO_DESAFIO`: Maior pontuação em um desafio específico (requer parâmetro `desafioId`).
        - `MAIOR_SOMA_DESAFIOS`: Maior pontuação agregada considerando apenas os desafios realizados.
        - `MAIOR_BONIFICACAO`: Maior pontuação obtida por itens de bonificação.
        - `MENOR_PENALIDADE`: Menor dedução acumulada por penalidades disciplinares.
      enum:
        - MAIOR_PONTUACAO_DESAFIO
        - MAIOR_SOMA_DESAFIOS
        - MAIOR_BONIFICACAO
        - MENOR_PENALIDADE
      example: MAIOR_PONTUACAO_DESAFIO

    # ----------------------------------------------------
    # Erros Padrão NestJS
    # ----------------------------------------------------
    ErroPadraoDto:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          description: "Código de status HTTP correspondente."
          example: 404
        message:
          type: string
          description: "Mensagem descritiva do erro em português."
          example: "Recurso não encontrado"
        error:
          type: string
          description: "Denominação canônica do status HTTP do erro."
          example: "Not Found"

    ErroValidacaoDto:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          description: "Código de status HTTP de validação (400)."
          example: 400
        message:
          type: array
          description: "Lista de mensagens detalhando as inconsistências dos campos validados."
          items:
            type: string
          example:
            - "nome não pode estar vazio"
            - "cor deve ser um código hexadecimal válido no formato #RRGGBB"
        error:
          type: string
          description: "Denominação canônica do erro."
          example: "Bad Request"
