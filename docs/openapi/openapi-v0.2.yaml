        descricao:
          type: string
          minLength: 1
          maxLength: 255
          description: "Descrição legível do critério de desempate."
          example: "Maior pontuação no Hackathon"

    ConfiguracaoEventoDto:
      type: object
      required:
        - conversaoPontoExtra
        - itensBonificacao
        - penalidadeMin
        - penalidadeMax
        - fatoresPresenca
        - criteriosDesempate
      properties:
        conversaoPontoExtra:
          type: array
          items:
            $ref: '#/components/schemas/ConversaoPontoExtraItemDto'
        itensBonificacao:
          type: array
