            $ref: '#/components/schemas/ItemBonificacaoConfigDto'
        penalidadeMin:
          type: integer
          nullable: true
          minimum: 0
          description: "Valor mínimo permitido para aplicação de uma penalidade. `null` enquanto a faixa não estiver configurada; deve ser nulo ou preenchido junto com `penalidadeMax` (ADR 0003, item 7)."
          example: 10
        penalidadeMax:
          type: integer
          nullable: true
          minimum: 0
          description: "Valor máximo permitido para aplicação de uma penalidade. `null` enquanto a faixa não estiver configurada; deve ser nulo ou preenchido junto com `penalidadeMin` (ADR 0003, item 7)."
          example: 50
        fatoresPresenca:
          type: array
          items:
            $ref: '#/components/schemas/FatorPresencaItemDto'
        criteriosDesempate:
          type: array
          items:
            $ref: '#/components/schemas/CriterioDesempateConfigDto'
      example:
        conversaoPontoExtra:
          - colocacao: 1
            pontoExtra: 1.0
          - colocacao: 2
            pontoExtra: 0.8
          - colocacao: 3
            pontoExtra: 0.6
        itensBonificacao:
          - id: 1
            nome: "Uniformização"
            teto: 10
          - id: 2
            nome: "Grito de guerra"
            teto: 10
        penalidadeMin: 10
        penalidadeMax: 50
        fatoresPresenca:
          - diasPresentes: 2
            fator: 1.0
          - diasPresentes: 1
            fator: 0.5
          - diasPresentes: 0
            fator: 0.0
        criteriosDesempate:
          - ordem: 1
            tipo: "MAIOR_PONTUACAO_DESAFIO"
            desafioId: 3
            descricao: "Maior pontuação no Hackathon"
          - ordem: 2
            tipo: "MENOR_PENALIDADE"
            desafioId: null
            descricao: "Menos penalidades"

