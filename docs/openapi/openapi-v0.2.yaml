              schema:
                $ref: '#/components/schemas/PresencaRegistradaDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ----------------------------------------------------
  # Desafios do Evento (US #202 / #245)
  # ----------------------------------------------------
  /eventos/{eventoId}/desafios:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Desafios
      summary: "Listar desafios do evento"
      description: |
        Lista os desafios do evento com suas tabelas de pontuação por colocação.
        Evento inexistente retorna 404; evento sem desafios retorna [].
        Ordem estável: numeroDia crescente do dia e, em seguida, id do desafio.
        Cada tabela de pontos vem ordenada por colocacao crescente.
      operationId: "listarDesafios"
      responses:
        '200':
          description: "Array de desafios do evento."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesafioDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags:
        - Desafios
      summary: "Criar desafio e tabela de pontos"
      description: |
        Cria desafio e pontos na mesma transação. O dia deve pertencer ao evento da URL.
        Exige pelo menos um grupo cadastrado e uma linha para cada grupo, com colocações únicas formando 1..N.
        Não cria resultado nem grupo.
      operationId: "criarDesafio"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarDesafioDto'
      responses:
        '201':
          $ref: '#/components/responses/DesafioRetornado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoDesafio'
        '422':
          $ref: '#/components/responses/TabelaInvalida'

  /eventos/{eventoId}/desafios/{desafioId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/DesafioIdParam'
    get:
      tags:
        - Desafios
      summary: "Consultar desafio no contexto do evento"
      description: "Consulta individual de um desafio e sua tabela de pontos. Desafio de outro evento retorna 404."
      operationId: "obterDesafioPorId"
      responses:
        '200':
          $ref: '#/components/responses/DesafioRetornado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags:
        - Desafios
      summary: "Atualizar desafio parcialmente"
      description: |
        Campos ausentes são preservados; null não é aceito. descricao vazia limpa a descrição.
        Quando pontosColocacao muda de valor, substitui a tabela inteira na mesma transação da atualização do desafio.
        A tabela resultante precisa atender a regra 1..N dos grupos atuais.
        Após resultados, o 409 só ocorre se diaId mudar de valor ou se o conteúdo da tabela (colocacao e pontos) mudar.
        A comparação da tabela considera os pares por colocacao, independentemente da ordem do array.
        Reenviar diaId ou pontosColocacao com os valores já gravados é permitido e não exige substituir a tabela.
        A presença desses campos no corpo não caracteriza mudança.
        Nome e descrição continuam editáveis, inclusive quando acompanhados do mesmo dia e da mesma tabela.
        Condição registrada no aceite do frontend no PR #31.
      operationId: "atualizarDesafio"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarDesafioDto'
      responses:
        '200':
          $ref: '#/components/responses/DesafioRetornado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoDesafio'
        '422':
          $ref: '#/components/responses/TabelaInvalida'
    delete:
      tags:
        - Desafios
      summary: "Excluir desafio sem dependências impeditivas"
      description: |
        Remove os pontos próprios e o desafio na mesma transação.
        Desafio usado em critério de desempate (ADR 0003) ou com resultado lançado retorna 409;
        não apagar resultados nem histórico em cascata.
      operationId: "excluirDesafio"
      responses:
        '204':
          description: "Desafio excluído, sem corpo de resposta."
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/ConflitoDesafio'

  # ----------------------------------------------------
  # Resultados de Desafios e Lançamentos (#223 / #206)
  # ----------------------------------------------------
  /eventos/{eventoId}/desafios/{desafioId}/resultados:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/DesafioIdParam'
    get:
      tags:
        - Resultados e Lançamentos
      summary: "Consultar colocações dos grupos no desafio (RF08, RF09, RF18)"
      description: |
        Valida evento e desafio no mesmo contexto e retorna uma linha por grupo do evento (ordenada por `grupoId` crescente).
        Sem lançamento prévio, a linha possui `id: null`, `colocacao: null`, `ausente: false` e `pontos: 0` (preenchimento pendente).
        Uma ausência gravada possui `id` preenchido, `colocacao: null`, `ausente: true` e `pontos: 0`.
      operationId: "listarResultadosDoDesafio"
      responses:
        '200':
          description: "Array com o resultado ou estado pendente de cada grupo do evento."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultadoDesafioDto'
              examples:
                antesDoPrimeiroLancamento:
                  value:
                    - id: null
                      grupoId: 1
                      colocacao: null
                      ausente: false
                      pontos: 0
                    - id: null
                      grupoId: 2
                      colocacao: null
                      ausente: false
                      pontos: 0
                comAusencia:
                  value:
                    - id: 11
                      grupoId: 1
                      colocacao: 1
                      ausente: false
                      pontos: 100
                    - id: 12
                      grupoId: 2
                      colocacao: null
                      ausente: true
                      pontos: 0
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
        - Resultados e Lançamentos
      summary: "Salvar todas as colocações do desafio (idempotente, RF08, RF09, RF18)"
      description: |
        Recebe um array completo com exatamente uma linha para cada grupo do evento.
        Com P grupos presentes, suas colocações devem formar a sequência `1..P` sem repetição nem lacunas; grupos com `ausente: true` exigem `colocacao: null` e recebem `0` ponto.
        Grava o conjunto e a trilha de auditoria na mesma transação, preservando o `id` de cada resultado existente.
      operationId: "salvarResultadosDoDesafio"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/SalvarResultadoDesafioDto'
            examples:
              todosPresentes:
                value:
                  - grupoId: 1
                    colocacao: 1
                    ausente: false
                  - grupoId: 2
                    colocacao: 2
                    ausente: false
              comAusencia:
                value:
                  - grupoId: 1
                    colocacao: 1
                    ausente: false
                  - grupoId: 2
                    colocacao: null
                    ausente: true
      responses:
        '200':
          description: "Colocações salvas com sucesso (todos os resultados retornam com id preenchido)."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultadoDesafioSalvoDto'
              example:
                - id: 11
                  grupoId: 1
                  colocacao: 1
                  ausente: false
                  pontos: 100
                - id: 12
                  grupoId: 2
                  colocacao: 2
                  ausente: false
                  pontos: 80
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: "Violação de regra de negócio (ex.: colocação repetida, sequência 1..P com lacunas, omissão/repetição de grupos ou combinação inválida entre ausente e colocacao)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "Dois grupos não podem ter a mesma colocação."
                error: "Unprocessable Entity"

  /auditoria:
    get:
      tags:
        - Auditoria
      summary: "Consultar histórico de alterações de um registro (RF18)"
      description: "Lista em ordem cronológica as alterações auditadas para uma entidade e chave primária específicas (`entidade` + `registroId`)."
      operationId: "listarAuditoria"
      parameters:
        - name: entidade
          in: query
          required: true
          description: "Nome canônico da entidade auditada (RESULTADO_DESAFIO, BONIFICACAO_GRUPO, PENALIDADE, DESEMPATE_MANUAL ou APURACAO)."
          schema:
            type: string
            enum:
              - RESULTADO_DESAFIO
              - BONIFICACAO_GRUPO
              - PENALIDADE
              - DESEMPATE_MANUAL
              - APURACAO
          example: "RESULTADO_DESAFIO"
        - name: registroId
          in: query
          required: true
          description: "Identificador numérico do registro auditado."
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 11
      responses:
        '200':
          description: "Histórico de alterações do registro."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroAuditoriaDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /eventos/{eventoId}/bonificacoes:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Resultados e Lançamentos
      summary: "Consultar bonificações de cada grupo por item (RF10)"
      description: "Retorna a lista de grupos do evento com os valores atribuídos em cada item de bonificação e a soma total por grupo."
      operationId: "listarBonificacoesEvento"
      responses:
        '200':
          description: "Bonificações por grupo retornadas com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BonificacaoGrupoResumoDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/bonificacoes/{grupoId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/GrupoIdParam'
    put:
      tags:
        - Resultados e Lançamentos
      summary: "Registrar bonificações de um grupo (idempotente, RF10)"
      description: "Salva de forma idempotente os pontos de bonificação do grupo por item. Valores que excedam o teto configurado para o item retornam 422."
      operationId: "salvarBonificacoesGrupo"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ItemBonificacaoLancamentoDto'
      responses:
        '200':
          description: "Bonificações do grupo registradas com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonificacaoGrupoResumoDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: "Valor de bonificação acima do teto configurado para o item."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "O valor de Uniformização passa do teto de 10."
                error: "Unprocessable Entity"

  /eventos/{eventoId}/penalidades:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Resultados e Lançamentos
      summary: "Listar penalidades aplicadas no evento (RF11)"
      description: "Retorna todas as penalidades lançadas para os grupos do evento."
      operationId: "listarPenalidadesEvento"
      responses:
        '200':
          description: "Lista de penalidades do evento."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PenalidadeDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags:
        - Resultados e Lançamentos
      summary: "Aplicar penalidade a um grupo (RF11)"
      description: |
        Registra uma nova penalidade disciplinar para um grupo do evento.
        Conforme ADR 0003, retorna 422 se a faixa de penalidade do evento ainda não estiver configurada ou se `pontos` estiver fora do intervalo `[penalidadeMin, penalidadeMax]`.
      operationId: "aplicarPenalidade"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPenalidadeDto'
      responses:
        '201':
          description: "Penalidade aplicada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenalidadeDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: "Pontos fora da faixa configurada no evento ou faixa ainda não configurada."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "A penalidade deve estar entre 10 e 50 pontos."
                error: "Unprocessable Entity"

  /eventos/{eventoId}/penalidades/{penalidadeId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/PenalidadeIdParam'
    patch:
      tags:
        - Resultados e Lançamentos
      summary: "Atualizar penalidade lançada (RF11)"
      description: "Corrige dados de uma penalidade existente no evento, validando a faixa configurada e registrando auditoria."
      operationId: "atualizarPenalidade"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarPenalidadeDto'
      responses:
        '200':
          description: "Penalidade atualizada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenalidadeDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
    delete:
      tags:
        - Resultados e Lançamentos
      summary: "Remover penalidade lançada (RF11)"
      description: "Exclui uma penalidade do evento e registra a operação na auditoria."
      operationId: "removerPenalidade"
      responses:
        '204':
          description: "Penalidade removida com sucesso (sem conteúdo no corpo)."
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ----------------------------------------------------
  # Classificação, Desempates e Apuração (#206 pt 3 / #204)
  # ----------------------------------------------------
  /eventos/{eventoId}/classificacao:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Classificação e Apuração
      summary: "Consultar classificação geral dos grupos (RF12, RF13)"
      description: |
        Calcula em tempo real a classificação das equipes a partir dos lançamentos atuais (`pontosDesafios + bonificacao - penalidade`),
        aplicando os critérios de desempate configurados (V12) e decisões manuais vigentes (ADR 0003).
        Retorna `dados` com a posição de cada grupo e `resumo` indicando desafios lançados e eventuais `empatesPendentes`.
      operationId: "consultarClassificacaoGrupos"
      responses:
        '200':
          description: "Classificação calculada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificacaoEnvelopeDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/desempates:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    post:
      tags:
        - Classificação e Apuração
      summary: "Registrar decisão manual de desempate (RF14)"
      description: |
        Registra em transação única uma nova versão de apuração, o snapshot da classificação e as decisões manuais de desempate para todos os empates pendentes (ADR 0003).
        Um novo envio substitui as decisões anteriores dos mesmos grupos. A decisão vale enquanto os grupos empatados mantiverem os mesmos pontos.

        Regras do envio:
        - Só é aceito depois que todos os desafios do evento forem lançados (`desafiosLancados == desafiosTotais` no `GET /classificacao`); antes disso responde `422`. O front deve esconder o formulário até lá.
        - Cada empate vem inteiro, com as posições que ele ocupa (empate no 2º lugar entre dois grupos: posições 2 e 3), e todos os empates pendentes vão no mesmo envio (`422`).
        - Grupo repetido ou fora de um empate responde `422`; grupo de outro evento responde `404`.
        - Reenviar a mesma decisão (mesmas posições e justificativa) não grava de novo e devolve a decisão vigente (RNF04).
      operationId: "registrarDesempateManual"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarDesempateDto'
      responses:
        '201':
          description: "Desempate manual registrado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesempateRegistradoDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'

  /eventos/{eventoId}/apuracao:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Classificação e Apuração
      summary: "Consultar apuração individual de ponto extra (RF16)"
      description: |
        Calcula na consulta o ponto extra individual de cada participante (`ROUND(pontoExtraGrupo * fator, 2)`) a partir da colocação do grupo e dos dias presentes.
        Retorna `409 Conflict` se faltarem grupos, desafios, resultados de alguma combinação desafio/grupo, conversões das colocações de 1 até a quantidade de grupos, fatores de 0 até a quantidade de dias ou se houver empate pendente.
      operationId: "consultarApuracaoIndividual"
      parameters:
        - $ref: '#/components/parameters/PaginaQueryParam'
        - $ref: '#/components/parameters/TamanhoQueryParam'
        - name: grupoId
          in: query
          required: false
          description: "Filtra a apuração pelo grupo."
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: turma
          in: query
          required: false
          description: "Filtra a apuração pela turma."
          schema:
            type: string
          example: "ES 2026.2"
        - name: busca
          in: query
          required: false
          description: "Busca parcial por nome ou matrícula do participante."
          schema:
            type: string
          example: "Lucas"
      responses:
        '200':
          description: "Apuração individual paginada com resumo de assiduidade e aptos."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApuracaoEnvelopeDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Evento com resultados ou configuração incompletos, ou classificação com empate pendente."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "A classificação tem empate pendente; registre o desempate antes da apuração."
                error: "Conflict"

  # ----------------------------------------------------
  # Relatórios (#207 / #228 / #229)
  # ----------------------------------------------------
  /eventos/{eventoId}/relatorios/parcial:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/FormatoRelatorioParam'
    get:
      tags:
        - Relatórios
      summary: "Exportar relatório parcial por grupo em PDF ou XLSX (RF15)"
      description: |
        Gera o relatório parcial da classificação das equipes considerando apenas os desafios com resultados já lançados, em formato PDF ou XLSX.
        Não bloqueia em caso de empate pendente (equipes empatadas saem na mesma posição marcadas com empate) e não expõe dados pessoais de alunos (RF15, RNF03).
      operationId: "exportarRelatorioParcial"
      responses:
        '200':
          $ref: '#/components/responses/ArquivoRelatorio'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/relatorios/final/previa:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - name: busca
        in: query
        required: false
        description: "Busca por nome, matrícula ou turma."
        schema:
          type: string
    get:
      tags:
        - Relatórios
      summary: "Consultar prévia do relatório final por participante"
      description: "Retorna um array puro ordenado por turma e nome, incluindo todos os dias do evento e ausências. Só fica disponível quando há ao menos um desafio e todos os grupos do evento têm resultado lançado em cada desafio, sem empate pendente e com a configuração completa (conversão e fatores de presença), para nenhum participante receber ponto extra 0 por falta de configuração. Resultados parciais permanecem disponíveis no relatório parcial."
      operationId: "consultarPreviaRelatorioFinal"
      responses:
        '200':
          description: "Prévia do relatório final."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TurmaRelatorioFinalDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Evento sem grupos, sem desafios, com resultados pendentes, empate pendente ou configuração incompleta (falta conversão de alguma colocação de 1 até a quantidade de grupos, ou fator de alguma quantidade de dias de 0 até a quantidade de dias)."
          $ref: '#/components/responses/Conflito'

  /eventos/{eventoId}/relatorios/final:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/FormatoRelatorioParam'
    get:
      tags:
        - Relatórios
      summary: "Exportar relatório final por participante em PDF ou XLSX"
      description: "Gera o relatório final agrupado por turma com presença de todos os dias, ausências e ponto extra individual. Só fica disponível quando há ao menos um desafio e todos os grupos do evento têm resultado lançado em cada desafio, sem empate pendente e com a configuração completa (conversão e fatores de presença), para nenhum participante receber ponto extra 0 por falta de configuração. Resultados parciais permanecem disponíveis no relatório parcial."
      operationId: "exportarRelatorioFinal"
      responses:
        '200':
          $ref: '#/components/responses/ArquivoRelatorioFinal'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Evento sem grupos, sem desafios, com resultados pendentes, empate pendente ou configuração incompleta (falta conversão de alguma colocação de 1 até a quantidade de grupos, ou fator de alguma quantidade de dias de 0 até a quantidade de dias)."
          $ref: '#/components/responses/Conflito'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT fornecido no formato 'Bearer <token>'"

  parameters:
    EventoIdParam:
      name: eventoId
      in: path
      required: true
      description: "Identificador numérico único do evento."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1

    DiaIdParam:
      name: diaId
      in: path
      required: true
      description: "Identificador numérico único do dia do evento."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1

    GrupoIdParam:
      name: grupoId
      in: path
      required: true
      description: "Identificador numérico único do grupo."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1

    DesafioIdParam:
      name: desafioId
      in: path
      required: true
      description: "Identificador numérico único do desafio."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 3

    ParticipanteIdParam:
      name: participanteId
      in: path
      required: true
      description: "Identificador numérico único do participante."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1

    PenalidadeIdParam:
      name: penalidadeId
      in: path
      required: true
      description: "Identificador numérico único da penalidade."
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1

    FormatoRelatorioParam:
      name: formato
      in: query
      required: true
      description: "Formato do arquivo de relatório a ser gerado (PDF ou XLSX)."
      schema:
        $ref: '#/components/schemas/FormatoRelatorio'
      example: PDF

    PaginaQueryParam:
      name: pagina
      in: query
      required: false
      description: "Página consultada (1-indexed)."
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    TamanhoQueryParam:
      name: tamanho
      in: query
      required: false
      description: "Quantidade de itens por página (máximo 100)."
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  responses:
    RequisicaoInvalida:
      description: "Requisição inválida. A validação de campos do payload (ValidationPipe) devolve `message` como lista; JSON malformado, parâmetros de rota inválidos e validações feitas nos serviços devolvem `message` como texto."
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErroValidacaoDto'
              - $ref: '#/components/schemas/ErroPadraoDto'
          examples:
            validacaoDeCampos:
              summary: "Campos inválidos no payload"
              value:
                statusCode: 400
                message:
                  - "email deve ser um endereço de e-mail válido"
                  - "senha deve ter pelo menos 6 caracteres"
                error: "Bad Request"
            jsonMalformado:
              summary: "Corpo da requisição com JSON malformado"
              value:
                statusCode: 400
                message: "Unexpected token '}', \"{\"nome\": }\" is not valid JSON"
                error: "Bad Request"

    NaoAutorizado:
      description: "Token JWT ausente, expirado ou inválido."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 401
            message: "Token de autenticação não fornecido ou inválido"
            error: "Unauthorized"

    NaoEncontrado:
      description: "Recurso solicitado não foi encontrado ou pertence a outro evento."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 404
            message: "Recurso não encontrado"
            error: "Not Found"

    Conflito:
      description: "Conflito de estado ou violação de unicidade. Nas rotas do relatório final, o campo message distingue empate pendente, ausência de desafios, ausência de grupos e resultados pendentes."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 409
            message: "Registro conflitante com o estado atual da entidade"
            error: "Conflict"

    RegraDeNegocio:
      description: "Violação de regra de negócio específica do domínio da aplicação."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 422
            message: "Ação não permitida pelas regras de negócio da competição"
            error: "Unprocessable Entity"

    DesafioRetornado:
      description: "Dados do desafio com a tabela de pontos."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesafioDto'

    ConflitoDesafio:
      description: |
        Nome duplicado no mesmo dia e evento; dependência impeditiva de
        exclusão ou alteração estrutural conforme o contrato de desafios (#245).
        No PATCH após resultados, a alteração estrutural exige mudança efetiva
        do dia ou dos pares colocacao/pontos; reenvio de valores iguais é permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 409
            message: "O desafio está vinculado a um critério de desempate."
            error: "Conflict"

    TabelaInvalida:
      description: |
        Evento sem grupos, tabela com número de linhas diferente de N
        ou colocações repetidas/com lacunas. N é o total de grupos do evento.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadraoDto'
          example:
            statusCode: 422
            message: "A tabela de pontos precisa ter uma linha por grupo (6)."
            error: "Unprocessable Entity"

    ArquivoRelatorioFinal:
      description: "Arquivo binário do relatório final agrupado por turma com cabeçalho Content-Disposition."
      headers:
        Content-Disposition:
          description: "Instrução de download com o nome sugerido para o arquivo."
          schema:
            type: string
          example: 'attachment; filename="relatorio-final-arena-final.pdf"; filename*=UTF-8''relatorio-final-arena-final.pdf'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
          example: "%PDF-1.4 relatório final do evento"
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
          example: "planilha binária .xlsx do relatório final"
    ArquivoRelatorio:
      description: "Arquivo binário do relatório gerado com cabeçalho Content-Disposition."
      headers:
        Content-Disposition:
          description: "Instrução de download com o nome sugerido para o arquivo."
          schema:
            type: string
          example: 'attachment; filename="relatorio-parcial-arena-comp-2026.pdf"; filename*=UTF-8''relatorio-parcial-arena-comp-2026.pdf'
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary

  schemas:
    # ----------------------------------------------------
    # Autenticação
    # ----------------------------------------------------
    LoginRequestDto:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          description: "E-mail cadastrado do usuário organizador ou administrador."
          example: "admin@arena.com"
        senha:
          type: string
          format: password
          description: "Senha de acesso do usuário."
          example: "SenhaForte@2026"

    LoginResponseDto:
      type: object
      required:
        - token
        - expiraEm
        - usuario
      properties:
        token:
          type: string
          description: "Token JWT assinado para autenticação nas rotas protegidas."
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImVtYWlsIjoiYWRtaW5AYXJlbmEuY29tIiwiaWF0IjoxNzg1MDU4NDAwLCJleHAiOjE3ODUxNDQ4MDB9.signature"
        expiraEm:
          type: string
          format: date-time
          description: "Timestamp de expiração do token em formato ISO 8601 UTC."
          example: "2026-11-23T22:38:00Z"
        usuario:
          $ref: '#/components/schemas/UsuarioResumoDto'

    UsuarioResumoDto:
      type: object
      required:
        - id
        - nome
        - email
      properties:
        id:
          type: integer
          description: "Identificador numérico do usuário."
          example: 1
        nome:
          type: string
          description: "Nome completo do usuário."
          example: "Administrador Arena"
        email:
          type: string
          format: email
          description: "E-mail cadastrado do usuário."
          example: "admin@arena.com"

    # ----------------------------------------------------
    # Eventos
    # ----------------------------------------------------
    EventoResumoDto:
      type: object
      required:
        - id
        - nome
        - ano
        - dataInicio
        - dataFim
        - ativo
        - quantidadeDias
      properties:
        id:
          type: integer
          description: "Identificador numérico único do evento."
          example: 1
        nome:
          type: string
          description: "Nome oficial do evento."
          example: "Arena Comp 2026"
        ano:
          type: integer
          description: "Ano de realização do evento."
          example: 2026
        dataInicio:
          type: string
          format: date
          description: "Data inicial do evento no formato ISO 8601 (YYYY-MM-DD)."
          example: "2026-11-20"
        dataFim:
          type: string
          format: date
          description: "Data final do evento no formato ISO 8601 (YYYY-MM-DD)."
          example: "2026-11-22"
        ativo:
