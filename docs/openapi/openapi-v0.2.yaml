openapi: 3.0.3
info:
  title: "EventScore API (Arena Comp 2026)"
  version: "0.2.0"
  description: |
    Especificação formal completa da API RESTful do **EventScore**, desenvolvida para a competição acadêmica **Arena Comp 2026**.

    A versão **v0.2.0** consolida 100% do contrato da aplicação (Sprints 01 e 02 — 44 operações distribuídas em 30 rotas), alinhada ao Contrato v0.3 aprovado pelo Frontend, às decisões arquiteturais do **ADR 0003** (migração V12) e **ADR 0004** (auditoria), e aos recortes homologados de Participantes (`#203`), Frequência (`#205`), Desafios (`#202` / `#245` — PR #31), Resultados (`#223` — PR #35), Bonificações/Penalidades/Classificação (`#206`), Configuração (`#199`), Apuração (`#204`) e Relatórios (`#207` / `#228` / `#229`).

    ### Principais Decisões de Contrato:
    - **Prefixo base:** `/api/v1` (definido nos servidores).
    - **Nomenclatura:** rotas em português, kebab-case, no plural e sem acentos (`/eventos`, `/dias`, `/grupos`, `/participantes`, `/desafios`, `/relatorios`).
    - **Identificadores:** no padrão `{nomeId}` (ex.: `{eventoId}`, `{diaId}`, `{grupoId}`, `{desafioId}`, `{participanteId}`, `{penalidadeId}`).
    - **Payloads:** propriedades JSON em `camelCase`. Banco de dados em `snake_case` com conversão automática na camada de serviço.
    - **Formatos de Data/Hora:**
      - Datas puras: ISO 8601 (`YYYY-MM-DD`).
      - Timestamps completos: ISO 8601 em UTC (`YYYY-MM-DDTHH:mm:ssZ`).
    - **Padrão de Resposta:**
      - Recursos individuais: retornam o próprio objeto JSON diretamente.
      - Listas simples: retornam array JSON direto `[...]`.
      - Listas com metadados/métricas: padrão envelope `{ "dados": [...], "paginacao"?: {...}, "resumo"?: {...} }`.
    - **Autenticação:** Bearer JWT informado no cabeçalho `Authorization: Bearer <token>`.
    - **Erros:** Formato padrão NestJS `{ "statusCode": number, "message": string | string[], "error": string }`.
  contact:
    name: "Equipe de Backend - EventScore"
servers:
  - url: http://localhost:3000/api/v1
    description: "Ambiente de desenvolvimento local"

tags:
  - name: Auth
    description: "Autenticação e perfil do usuário do sistema"
  - name: Eventos
    description: "Gestão do ciclo de vida, detalhes e ativação de eventos"
  - name: Dias
    description: "Gestão do cronograma e dos dias de competição do evento"
  - name: Grupos
    description: "Gestão das equipes/grupos de participantes do evento"
  - name: Configuração
    description: "Configuração de regras de pontuação, bonificações, faixa de penalidades, fatores de presença e critérios de desempate (RF02, RF10, RF11, RF13)"
  - name: Participantes
    description: "Importação em lote (CSV/XLSX) e consulta paginada de participantes do evento (RF04)"
  - name: Frequência
    description: "Consulta e registro idempotente de presença diária dos participantes (RF07)"
  - name: Desafios
    description: "Gestão dos desafios do evento e respectivas tabelas de pontuação por colocação (RF05, RF06)"
  - name: Resultados e Lançamentos
    description: "Lançamento idempotente de colocações por desafio, bonificações e penalidades (RF08 a RF11, RF18)"
  - name: Auditoria
    description: "Histórico de alterações de lançamentos e registros auditados (RF18)"
  - name: Classificação e Apuração
    description: "Cálculo em tempo real da classificação das equipes, desempate manual e apuração individual de ponto extra (RF12 a RF14, RF16)"
  - name: Relatórios
    description: "Exportação de relatórios parciais e finais em PDF/XLSX e prévia agrupada por turma (RF15, RF17, RNF03)"

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: "Autenticar usuário"
      description: "Autentica um organizador ou administrador com e-mail e senha. Retorna o token JWT e a data de expiração ISO 8601 UTC."
      operationId: "autenticarUsuario"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
            example:
              email: "admin@arena.com"
              senha: "SenhaForte@2026"
      responses:
        '200':
          description: "Autenticação realizada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjEsImVtYWlsIjoiYWRtaW5AYXJlbmEuY29tIiwiaWF0IjoxNzg1MDU4NDAwLCJleHAiOjE3ODUxNDQ4MDB9.signature"
                expiraEm: "2026-11-23T22:38:00Z"
                usuario:
                  id: 1
                  nome: "Administrador Arena"
                  email: "admin@arena.com"
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          description: "Credenciais de acesso inválidas."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 401
                message: "E-mail ou senha inválidos"
                error: "Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: "Obter dados do usuário autenticado"
      description: "Retorna as informações do usuário atual associado ao token JWT enviado no cabeçalho Authorization."
      operationId: "obterUsuarioAutenticado"
      responses:
        '200':
          description: "Dados do usuário autenticado retornados com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumoDto'
              example:
                id: 1
                nome: "Administrador Arena"
                email: "admin@arena.com"
        '401':
          $ref: '#/components/responses/NaoAutorizado'

  /eventos:
    get:
      tags:
        - Eventos
      summary: "Listar eventos"
      description: "Retorna a listagem de todos os eventos cadastrados na plataforma."
      operationId: "listarEventos"
      responses:
        '200':
          description: "Lista de eventos cadastrados retornada com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoResumoDto'
              example:
                - id: 1
                  nome: "Arena Comp 2026"
                  ano: 2026
                  dataInicio: "2026-11-20"
                  dataFim: "2026-11-22"
                  ativo: true
                  quantidadeDias: 3
                - id: 2
                  nome: "Arena Comp 2025"
                  ano: 2025
                  dataInicio: "2025-11-14"
                  dataFim: "2025-11-16"
                  ativo: false
                  quantidadeDias: 3
        '401':
          $ref: '#/components/responses/NaoAutorizado'
    post:
      tags:
        - Eventos
      summary: "Criar novo evento"
      description: "Cadastra um novo evento no sistema. Novos eventos são criados por padrão como inativos (`ativo: false`)."
      operationId: "criarEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEventoDto'
            example:
              nome: "Arena Comp 2026"
              ano: 2026
              dataInicio: "2026-11-20"
              dataFim: "2026-11-22"
              quantidadeDias: 3
      responses:
        '201':
          description: "Evento criado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResumoDto'
              example:
                id: 1
                nome: "Arena Comp 2026"
                ano: 2026
                dataInicio: "2026-11-20"
                dataFim: "2026-11-22"
                ativo: false
                quantidadeDias: 3
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '409':
          description: "Conflito: já existe um evento com o mesmo nome e ano (`uq_evento_nome_ano`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Já existe um registro com os dados informados"
                error: "Conflict"
        '422':
          description: "Violação de regra de negócio (ex.: data de término anterior à data de início ou quantidadeDias superior ao período do evento)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "A data de término deve ser igual ou posterior à data de início do evento"
                error: "Unprocessable Entity"

  /eventos/ativo:
    get:
      tags:
        - Eventos
      summary: "Consultar evento ativo"
      description: "Retorna os detalhes do evento marcado atualmente como ativo. Apenas um evento pode estar ativo por vez (RF02)."
      operationId: "obterEventoAtivo"
      responses:
        '200':
          description: "Dados do evento ativo no momento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResumoDto'
              example:
                id: 1
                nome: "Arena Comp 2026"
                ano: 2026
                dataInicio: "2026-11-20"
                dataFim: "2026-11-22"
                ativo: true
                quantidadeDias: 3
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          description: "Nenhum evento ativo encontrado."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 404
                message: "Nenhum evento está ativo no momento"
                error: "Not Found"

  /eventos/{eventoId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Eventos
      summary: "Consultar evento por ID"
      description: "Retorna os detalhes completos do evento, incluindo o indicador booleano `temResultado`, que indica se já há apurações ou resultados lançados."
      operationId: "obterEventoPorId"
      responses:
        '200':
          description: "Detalhes do evento retornados com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDetalheDto'
              example:
                id: 1
                nome: "Arena Comp 2026"
                ano: 2026
                dataInicio: "2026-11-20"
                dataFim: "2026-11-22"
                ativo: true
                quantidadeDias: 3
                temResultado: false
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags:
        - Eventos
      summary: "Atualizar evento"
      description: "Atualiza parcialmente os campos cadastrais de um evento existente."
      operationId: "atualizarEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarEventoDto'
            example:
              nome: "Arena Comp 2026 - Edição Oficial"
              dataFim: "2026-11-23"
      responses:
        '200':
          description: "Evento atualizado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResumoDto'
              example:
                id: 1
                nome: "Arena Comp 2026 - Edição Oficial"
                ano: 2026
                dataInicio: "2026-11-20"
                dataFim: "2026-11-23"
                ativo: true
                quantidadeDias: 3
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: já existe outro evento com o mesmo nome e ano (`uq_evento_nome_ano`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Já existe um registro com os dados informados"
                error: "Conflict"
        '422':
          description: "Violação de regra de negócio (ex.: período ou quantidadeDias incompatível com o intervalo de datas ou com dias já cadastrados)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "A nova data de início não pode ser posterior aos dias de evento já cadastrados"
                error: "Unprocessable Entity"

  /eventos/{eventoId}/ativar:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    post:
      tags:
        - Eventos
      summary: "Ativar evento"
      description: "Define o evento informado como o evento ativo do sistema (RF02). Caso haja outro evento ativo previamente, ele será desativado automaticamente."
      operationId: "ativarEvento"
      responses:
        '200':
          description: "Evento ativado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoResumoDto'
              example:
                id: 1
                nome: "Arena Comp 2026"
                ano: 2026
                dataInicio: "2026-11-20"
                dataFim: "2026-11-22"
                ativo: true
                quantidadeDias: 3
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/dias:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Dias
      summary: "Listar dias do evento"
      description: "Retorna a lista de dias cadastrados para o evento informado, em ordem cronológica."
      operationId: "listarDiasEvento"
      responses:
        '200':
          description: "Lista de dias do evento retornada com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiaEventoDto'
              example:
                - id: 1
                  numeroDia: 1
                  data: "2026-11-20"
                - id: 2
                  numeroDia: 2
                  data: "2026-11-21"
                - id: 3
                  numeroDia: 3
                  data: "2026-11-22"
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags:
        - Dias
      summary: "Cadastrar dia no evento"
      description: "Adiciona um dia de competição ao cronograma do evento. A data deve pertencer ao intervalo de datas do evento, o `numeroDia` deve ser único e não pode exceder a `quantidadeDias` configurada para o evento."
      operationId: "criarDiaEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarDiaEventoDto'
            example:
              numeroDia: 1
              data: "2026-11-20"
      responses:
        '201':
          description: "Dia cadastrado com sucesso no evento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaEventoDto'
              example:
                id: 1
                numeroDia: 1
                data: "2026-11-20"
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: número do dia ou data já cadastrada para este evento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Já existe um dia com esse número neste evento."
                error: "Conflict"
        '422':
          description: "Violação de regra de negócio (data fora do período do evento ou numeroDia maior que quantidadeDias)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "O número do dia não pode exceder a quantidade de dias do evento."
                error: "Unprocessable Entity"

  /eventos/{eventoId}/dias/{diaId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/DiaIdParam'
    patch:
      tags:
        - Dias
      summary: "Atualizar dia do evento"
      description: "Atualiza o número do dia ou a data de um dia específico do evento."
      operationId: "atualizarDiaEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarDiaEventoDto'
            example:
              data: "2026-11-21"
      responses:
        '200':
          description: "Dia do evento atualizado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiaEventoDto'
              example:
                id: 1
                numeroDia: 1
                data: "2026-11-21"
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: número do dia ou data já utilizados por outro dia deste evento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Já existe um dia com esse número neste evento."
                error: "Conflict"
        '422':
          description: "Violação de regra de negócio (data fora do período do evento ou numeroDia maior que quantidadeDias)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "O número do dia não pode exceder a quantidade de dias do evento."
                error: "Unprocessable Entity"
    delete:
      tags:
        - Dias
      summary: "Excluir dia do evento"
      description: "Exclui um dia cadastrado no evento. Não é permitida a exclusão caso existam desafios associados ou presenças lançadas."
      operationId: "excluirDiaEvento"
      responses:
        '204':
          description: "Dia excluído com sucesso (sem conteúdo no corpo)."
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: o dia possui desafios ou presenças vinculadas e não pode ser excluído."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Não é possível excluir o dia pois já existem registros de presença ou desafios vinculados"
                error: "Conflict"
        '503':
          description: "Serviço indisponível: ocorre quando a verificação de dependências (presenças/desafios) está indisponível. Este status não representa um conflito de dependência existente (que continua retornando 409 Conflict)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 503
                message: "Não foi possível verificar as dependências do dia. Tente novamente mais tarde."
                error: "Service Unavailable"

  /eventos/{eventoId}/grupos:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Grupos
      summary: "Listar grupos do evento"
      description: "Retorna a lista de grupos vinculados ao evento, contendo a cor de identificação e o total de participantes."
      operationId: "listarGruposEvento"
      responses:
        '200':
          description: "Lista de grupos do evento retornada com sucesso."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrupoResumoDto'
              example:
                - id: 1
                  nome: "Alfa"
                  cor: "#FF5733"
                  quantidadeParticipantes: 12
                - id: 2
                  nome: "Beta"
                  cor: "#3380FF"
                  quantidadeParticipantes: 10
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags:
        - Grupos
      summary: "Criar grupo no evento"
      description: "Cadastra uma nova equipe/grupo para o evento com nome e cor hexadecimal (#RRGGBB). O grupo inicia com 0 participantes."
      operationId: "criarGrupoEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarGrupoDto'
            example:
              nome: "Alfa"
              cor: "#FF5733"
      responses:
        '201':
          description: "Grupo criado com sucesso no evento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoResumoDto'
              example:
                id: 1
                nome: "Alfa"
                cor: "#FF5733"
                quantidadeParticipantes: 0
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: nome do grupo ou cor já cadastrada para este evento."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "Já existe um grupo cadastrado com o nome 'Alfa' neste evento"
                error: "Conflict"

  /eventos/{eventoId}/grupos/{grupoId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
      - $ref: '#/components/parameters/GrupoIdParam'
    get:
      tags:
        - Grupos
      summary: "Consultar grupo por ID"
      description: "Retorna os dados cadastrais e métricas de um grupo específico do evento."
      operationId: "obterGrupoPorId"
      responses:
        '200':
          description: "Dados do grupo retornados com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoResumoDto'
              example:
                id: 1
                nome: "Alfa"
                cor: "#FF5733"
                quantidadeParticipantes: 12
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    patch:
      tags:
        - Grupos
      summary: "Atualizar grupo do evento"
      description: "Atualiza parcialmente o nome ou a cor do grupo. Não é permitida a alteração se o evento já possuir resultados lançados (RF03)."
      operationId: "atualizarGrupoEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarGrupoDto'
            example:
              nome: "Alfa Prime"
              cor: "#FF2A00"
      responses:
        '200':
          description: "Grupo atualizado com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoResumoDto'
              example:
                id: 1
                nome: "Alfa Prime"
                cor: "#FF2A00"
                quantidadeParticipantes: 12
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: os grupos não podem mais ser alterados porque já há resultado lançado (bloqueio por RF03) ou nome/cor duplicados."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 409
                message: "os grupos não podem mais ser alterados porque já há resultado lançado"
                error: "Conflict"
    delete:
      tags:
        - Grupos
      summary: "Excluir grupo do evento"
      description: "Remove um grupo do evento. Não é permitida a exclusão se o evento já possuir resultados lançados (RF03) ou se houver participantes vinculados (ADR 0003)."
      operationId: "excluirGrupoEvento"
      responses:
        '204':
          description: "Grupo excluído com sucesso (sem conteúdo no corpo)."
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: "Conflito: os grupos não podem mais ser alterados porque já há resultado lançado (RF03) ou o grupo possui participantes vinculados (ADR 0003)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              examples:
                bloqueadoPorResultado:
                  summary: "Evento já possui resultados lançados (RF03)"
                  value:
                    statusCode: 409
                    message: "os grupos não podem mais ser alterados porque já há resultado lançado"
                    error: "Conflict"
                grupoComParticipantes:
                  summary: "Grupo possui participantes vinculados (ADR 0003)"
                  value:
                    statusCode: 409
                    message: "O grupo tem 12 participantes. Remova ou mova os participantes antes de excluir."
                    error: "Conflict"

  # ----------------------------------------------------
  # Configuração do Evento (#199)
  # ----------------------------------------------------
  /eventos/{eventoId}/configuracao:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Configuração
      summary: "Consultar configuração de pontuação do evento (RF02)"
      description: "Retorna a configuração completa do evento: conversão de colocação em ponto extra, itens de bonificação, faixa de penalidade, fatores de presença e critérios de desempate."
      operationId: "obterConfiguracaoEvento"
      responses:
        '200':
          description: "Configuração do evento retornada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoEventoDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags:
        - Configuração
      summary: "Salvar configuração completa do evento (idempotente)"
      description: |
        Substitui de forma transacional e idempotente toda a configuração de regras do evento.
        Conforme o ADR 0003 (V12):
        - `desafioId` nos critérios de desempate é obrigatório apenas para `MAIOR_PONTUACAO_DESAFIO` e proibido nos demais tipos.
        - `penalidadeMin` não pode ser maior que `penalidadeMax`, e a alteração da faixa não pode deixar fora do intervalo penalidades já lançadas (retorna 422).
      operationId: "salvarConfiguracaoEvento"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracaoEventoDto'
      responses:
        '200':
          description: "Configuração salva com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracaoEventoDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '422':
          description: "Violação de regra de negócio (ex.: penalidade mínima maior que a máxima, penalidade já lançada fora da nova faixa ou diasPresentes acima da quantidade de dias do evento)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 422
                message: "A penalidade mínima não pode ser maior que a máxima."
                error: "Unprocessable Entity"

  # ----------------------------------------------------
  # Participantes do Evento (#203)
  # ----------------------------------------------------
  /eventos/{eventoId}/participantes:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    get:
      tags:
        - Participantes
      summary: "Listar participantes do evento com paginação e filtros (RF04)"
      description: "Lista os participantes do evento com suporte a paginação e filtros opcionais por grupo, turma e busca textual por nome ou matrícula."
      operationId: "listarParticipantesEvento"
      parameters:
        - $ref: '#/components/parameters/PaginaQueryParam'
        - $ref: '#/components/parameters/TamanhoQueryParam'
        - name: grupoId
          in: query
          required: false
          description: "Filtra participantes pelo identificador do grupo."
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: turma
          in: query
          required: false
          description: "Filtra participantes pela turma."
          schema:
            type: string
          example: "ES 2026.2"
        - name: busca
          in: query
          required: false
          description: "Busca parcial case-insensitive por nome ou matrícula."
          schema:
            type: string
          example: "Lucas"
      responses:
        '200':
          description: "Lista paginada de participantes com resumo totalizador."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantesListagemDto'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/participantes/importacao/previa:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    post:
      tags:
        - Participantes
      summary: "Pré-visualizar importação de participantes via CSV ou XLSX (RF04)"
      description: |
        Valida a planilha enviada no campo `arquivo` (CSV UTF-8 separado por vírgula ou ponto e vírgula, ou XLSX, até 5 MB) sem gravar dados no banco.
        Retorna todas as linhas do arquivo indicando `VALIDO` ou `ERRO` e o respectivo `motivoErro`.
      operationId: "previsualizarImportacaoParticipantes"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadArquivoPlanilhaDto'
      responses:
        '200':
          description: "Prévia da importação processada com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoPrevistaDto'
        '400':
          description: "Arquivo ausente, malformado ou acima do limite de 5 MB."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 400
                message: "O arquivo excede o limite de 5 MB"
                error: "Bad Request"
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos/{eventoId}/participantes/importacao:
    parameters:
      - $ref: '#/components/parameters/EventoIdParam'
    post:
      tags:
        - Participantes
      summary: "Confirmar e gravar importação de participantes (RF04)"
      description: |
        Revalida a planilha enviada (CSV ou XLSX até 5 MB) e persiste os participantes em transação única somente se não houver nenhuma linha com erro.
        Caso exista qualquer linha inválida, responde 422 com o detalhamento completo das linhas e não grava nenhum registro.
      operationId: "confirmarImportacaoParticipantes"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadArquivoPlanilhaDto'
      responses:
        '201':
          description: "Participantes importados com sucesso."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoConfirmadaDto'
        '400':
          description: "Arquivo ausente, malformado ou acima do limite de 5 MB."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroPadraoDto'
              example:
                statusCode: 400
                message: "O arquivo excede o limite de 5 MB"
                error: "Bad Request"
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: "A planilha contém linhas com erro; nenhum participante foi persistido."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoErro422Dto'

  # ----------------------------------------------------
  # Frequência / Presenças (#205)
  # ----------------------------------------------------
  /eventos/{eventoId}/dias/{diaId}/presencas:
