# Configuração da análise estática do EventScore (instrumentação do estudo)
sonar.projectKey=eventscore
sonar.projectName=EventScore
sonar.sourceEncoding=UTF-8

# Backend (NestJS) e frontend (React)
sonar.sources=src,web/src
sonar.tests=src,test,web/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,test/**
sonar.exclusions=src/generated/**,**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts

# Cobertura do backend gerada pelo Vitest (formato lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
